<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00967C">
<title>Rechtschreib-Training</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rechtschreib-Training">
<style>
  /* Farben: Schulgrün #00967C in Stufen, Bernstein nur für "noch offen", niemals Rot. */
  :root {
    --bg: #f2faf8;
    --surface: #ffffff;
    --surface-2: #e3f4ef;
    --ink: #17302b;
    --ink-soft: #4a6660;
    --line: #c9e4dc;
    --accent: #00967c;
    --accent-strong: #00725e;
    --accent-deep: #0b4a3f;
    --accent-ink: #ffffff;
    --accent-soft: #bfe6dc;
    --amber: #b86e00;
    --amber-soft: #fff1d6;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
    background: var(--bg); color: var(--ink);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  :focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px; border-radius: 6px; }
  .wrap { width: 100%; max-width: 980px; margin-inline: auto; padding-inline: 16px; }

  /* Update-Leiste: erscheint auf jedem Bildschirm oben */
  #update-leiste {
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--amber-soft); color: var(--ink); border-bottom: 2px solid var(--amber);
    padding: 10px 16px; font-size: 1rem;
  }
  #update-leiste button {
    min-height: 48px; padding: 0 18px; font: inherit; font-weight: 600; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  #update-leiste button:hover { background: var(--accent-strong); }

  /* Kopfbereich mit Aquarell-Banner und Schullogo */
  .hero {
    position: relative; isolation: isolate; overflow: hidden;
    border-radius: 0 0 22px 22px;
    background: var(--surface-2);
  }
  .hero .banner {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center; z-index: -1;
  }
  .hero-inner {
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
    gap: 12px 20px; padding-block: 20px; padding-inline: 16px;
    max-width: 980px; margin-inline: auto;
  }
  .logo-plate {
    background: var(--surface); border-radius: 18px; padding: 8px 12px;
    box-shadow: 0 1px 0 var(--line), 0 4px 14px rgba(0, 114, 94, .12);
    display: grid; place-items: center;
  }
  .logo { display: block; width: clamp(56px, 11vw, 84px); height: auto; }
  .hero h1 {
    margin: 0; font-size: clamp(1.25rem, 4.6vw, 2.4rem); line-height: 1.15; overflow-wrap: anywhere;
    color: var(--accent-deep); font-weight: 700; text-wrap: balance;
  }
  .hero p { margin: 6px 0 0; color: var(--ink); max-width: 46ch; font-size: clamp(.95rem, 2.6vw, 1.05rem); }

  main { flex: 1; padding-block: 24px; }

  footer { padding: 14px 16px 18px; font-size: .9rem; text-align: center; color: var(--ink-soft); }

  @media (max-width: 420px) {
    .hero-inner { gap: 10px 14px; padding-block: 14px; }
  }
</style>
</head>
<body>
<div id="update-leiste" role="status">
  <span>Neue Version verfügbar</span>
  <button id="update-knopf" type="button">Jetzt aktualisieren</button>
</div>

<header class="hero">
  <img class="banner" data-asset="banner" alt="" width="1000" height="333">
  <div class="hero-inner">
    <div class="logo-plate">
      <img class="logo" data-asset="logo" alt="Evangelisches Schulzentrum Bad Düben" width="200" height="269">
    </div>
    <div>
      <h1>Rechtschreib-Training</h1>
      <p>Üben mit Klicken. Du schreibst nichts, du entscheidest nur.</p>
    </div>
  </div>
</header>

<main id="start" class="wrap"></main>

<footer>Evangelisches Schulzentrum Bad Düben &middot; <span style="white-space:nowrap">Version <span id="version"></span></span></footer>

<script>
const APP_VERSION = "1.1.0";
document.getElementById("version").textContent = APP_VERSION;

(function () {
  if (!("serviceWorker" in navigator)) return;
  const leiste = document.getElementById("update-leiste");
  let neuLaden = false;

  function zeigeUpdate(worker) {
    leiste.style.display = "flex";
    document.getElementById("update-knopf").onclick = function () {
      worker.postMessage({ type: "SKIP_WAITING" });
    };
  }

  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (neuLaden) return;
    neuLaden = true;
    location.reload();
  });

  navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (reg) {
    if (reg.waiting && navigator.serviceWorker.controller) zeigeUpdate(reg.waiting);
    reg.addEventListener("updatefound", function () {
      const neu = reg.installing;
      if (!neu) return;
      neu.addEventListener("statechange", function () {
        if (neu.state === "installed" && navigator.serviceWorker.controller) zeigeUpdate(neu);
      });
    });
    reg.update();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") reg.update();
    });
  }).catch(function () {});
})();
</script>
